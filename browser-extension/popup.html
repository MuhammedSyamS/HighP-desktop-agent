<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      width: 260px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #334155;
    }
    .badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 9999px;
      background: rgba(99, 102, 241, 0.2);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.4);
    }
    .status-card {
      background: #1e293b;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      font-size: 12px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .label {
      color: #94a3b8;
    }
    .val {
      font-weight: 600;
      color: #38bdf8;
      font-family: monospace;
    }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      margin-right: 4px;
    }
    .privacy-notice {
      margin-top: 10px;
      font-size: 10px;
      color: #64748b;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <strong style="font-size: 13px;">HighP Browser Tracker</strong>
    <span class="badge">Privacy Safe</span>
  </div>
  <div class="status-card">
    <div class="row">
      <span class="label">Agent Link:</span>
      <span id="agentStatus" class="val" style="color: #22c55e;"><span class="dot"></span>Connected</span>
    </div>
    <div class="row">
      <span class="label">Current Domain:</span>
      <span id="domainVal" class="val">Detecting...</span>
    </div>
  </div>
  <div class="privacy-notice">
    🔒 HighP records only active domains (e.g., notion.so). Full URLs, form inputs, passwords, and search history are never captured.
  </div>
  <script src="popup.js"></script>
</body>
</html>
