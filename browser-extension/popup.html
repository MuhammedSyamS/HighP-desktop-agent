<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HighP Web Tracker</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-width: 280px;
      max-width: 340px;
      width: 100%;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      overflow-x: hidden;
      line-height: 1.4;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #334155;
    }
    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-badge {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: #6366f1;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13px;
    }
    .badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 9999px;
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.35);
      white-space: nowrap;
    }
    .status-card {
      background: #1e293b;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #334155;
      font-size: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      gap: 8px;
    }
    .row:last-child {
      margin-bottom: 0;
    }
    .label {
      color: #94a3b8;
      font-size: 11.5px;
      font-weight: 500;
    }
    .val {
      font-weight: 700;
      color: #38bdf8;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11.5px;
      text-align: right;
      word-break: break-all;
    }
    .dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      margin-right: 5px;
      box-shadow: 0 0 6px rgba(34, 197, 94, 0.5);
    }
    .privacy-notice {
      margin-top: 12px;
      font-size: 10.5px;
      color: #64748b;
      line-height: 1.45;
      background: rgba(15, 23, 42, 0.6);
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(51, 65, 85, 0.5);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand-wrap">
      <div class="logo-badge">⚡</div>
      <strong style="font-size: 13px; font-weight: 800;">HighP Web Tracker</strong>
    </div>
    <span class="badge">Privacy Safe</span>
  </div>
  <div class="status-card">
    <div class="row">
      <span class="label">Agent Link:</span>
      <span id="agentStatus" class="val" style="color: #22c55e;"><span class="dot"></span>Connected</span>
    </div>
    <div class="row">
      <span class="label">Active Domain:</span>
      <span id="domainVal" class="val">Detecting...</span>
    </div>
  </div>
  <div class="privacy-notice">
    🔒 HighP records only active top-level domains (e.g. notion.so). Full URLs, form inputs, credentials, and browsing history are never recorded.
  </div>
  <script src="popup.js"></script>
</body>
</html>
